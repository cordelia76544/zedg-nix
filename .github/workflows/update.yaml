name: Auto Update Upstream

on:
  schedule:
    # 每天北京时间早上 8 点（UTC 0 点）运行检查
    - cron: "0 0 * * *"
  workflow_dispatch: # 允许你在 GitHub 网页端手动点击按钮触发更新

# 赋予自动提交代码的权限
permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check for upstream updates
        id: update
        run: bash ./update.sh

      - name: Test Build (Dry-run)
        # 运行构建测试，如果下载的哈希不对或者打包逻辑出错，Action 会在这里失败，防止提交损坏的代码
        run: nix build .#

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(update): bump zedg to latest upstream release"
          title: "🚀 Update ZedG to latest upstream release"
          body: |
            上游 `x6nux/zed-globalization` 发布了新版本。
            此 PR 已自动更新 `sources.nix` 中的版本号和哈希值，并通过了本地 Nix 构建测试。

            请检查无误后合并。
          branch: "bot/auto-update" # Action 会自动创建这个分支并提 PR
          base: main
